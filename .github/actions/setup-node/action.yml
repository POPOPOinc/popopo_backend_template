##
## Node.js 開発環境をセットアップします。
##
## 以下のツールをセットアップします:
##   - pnpm (pnpm/action-setup、package.json の packageManager から読み取り)
##   - Java 21 (actions/setup-java、temurin)
##   - Node.js (actions/setup-node、package.json から読み取り)
##
## action は full commit SHA で pin しています（`# vX.Y.Z` はそのタグ）。
##
## Java は firebase-tools が Java 21 以上を要求するため含まれています。
##
name: setup-node
description: Setup Node.js development environment with pnpm, Java 21, and Node.js

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: 'temurin'
        java-version: '21'

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: package.json
        cache: pnpm
