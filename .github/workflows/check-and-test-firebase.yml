name: check and test (firebase)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check-and-test-firebase:
    name: run check and test (firebase)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - run: pnpm install --frozen-lockfile
      - uses: reviewdog/action-eslint@3ee2a450da17e060b9dfa4bffd53976906c6b2b0 # v1.36.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          eslint_flags: "--config firebase/eslint.config.mjs firebase/src/firestore.indexes.json"
          tool_name: 'eslint (firebase)'
          level: error
          fail_level: warning
          filter_mode: nofilter
        if: github.event_name == 'pull_request'
      - working-directory: ./firebase
        name: run test
        # emulators:exec でエミュレータを起動してから jest を実行する
        run: pnpm run test
