name: check and test (manage)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check-and-test-manage:
    name: run check and test (manage)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - working-directory: ./manage
        run: |
          pnpm install --frozen-lockfile
          pnpm run check
          pnpm run lint
          pnpm run --if-present test
          pnpm run build:mode beta
      - uses: reviewdog/action-eslint@3ee2a450da17e060b9dfa4bffd53976906c6b2b0 # v1.36.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          eslint_flags: "--config manage/eslint.config.mjs manage/src"
          tool_name: 'eslint (manage)'
          level: error
          fail_level: warning
          filter_mode: file
        if: github.event_name == 'pull_request'
