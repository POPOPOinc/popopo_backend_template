name: check and test (algolia-index)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check-and-test-algolia-index:
    name: run check and test (algolia-index)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - working-directory: ./algolia-index
        name: check and build
        run: |
          pnpm install --frozen-lockfile
          pnpm run check
          pnpm run build
