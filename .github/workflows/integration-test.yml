name: integration-test

on:
  workflow_dispatch:
    inputs:
      env:
        type: choice
        description: "target environment"
        options: [beta, dev, stage, prod]
      test_name_pattern:
        type: string
        description: "Test name pattern (optional, e.g., '投稿'). If empty, runs all tests."
        required: false
        default: ""
      slack_at_channel_on_failure:
        type: string
        description: "失敗時に @channel メンションを付けるか ('true'/'false')"
        required: false
        default: 'false'

  workflow_call:
    inputs:
      env:
        type: string
      test_name_pattern:
        type: string
        required: false
        default: ""
      slack_at_channel_on_failure:
        type: string
        required: false
        default: 'false'

permissions:
  contents: read

env:
  SLACK_DEPLOY_CHANNEL_ID: ${{ vars.SLACK_DEPLOY_CHANNEL_ID }}

jobs:
  execute:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    # ワークフローレベルの concurrency は workflow_call 時に呼び出し元ワークフローごとに
    # スコープが分離されるため、deploy-all (workflow_call) と直接実行 (workflow_dispatch) で
    # 別グループとなり並列実行を防げない。
    # ジョブレベルの concurrency は呼び出し元に依存しないグローバルなグループとなるため、
    # ここに配置することで全トリガー間で排他制御が機能する。
    concurrency:
      group: integration-test-${{ inputs.env }}
      cancel-in-progress: true
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: ./.github/actions/setup-sops
      with:
        key: ${{ (inputs.env == 'prod' && secrets.SOPS_KEY_PROD) || (inputs.env == 'stage' && secrets.SOPS_KEY_STAGE) || (inputs.env == 'dev' && secrets.SOPS_KEY_DEV) || secrets.SOPS_KEY_BETA }}

    - uses: ./.github/actions/setup-node

    - run: pnpm install --frozen-lockfile

    - run: pnpm -C schema run build

    - name: Run integration test
      shell: bash
      env:
        TARGET_ENV: ${{ inputs.env }}
        TEST_NAME_PATTERN: ${{ inputs.test_name_pattern }}
      run: |
        pnpm -C integration-test run test:"$TARGET_ENV" ${TEST_NAME_PATTERN:+--testNamePattern="$TEST_NAME_PATTERN"}
  notify:
    runs-on: ubuntu-latest
    needs: [execute]
    if: always()
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/slack-job-result-notification
        with:
          env: ${{ inputs.env }}
          refName: ${{ github.ref_name }}
          applicationName: 'integration-test'
          result: ${{ needs.execute.result }}
          slackToken: ${{ secrets.SLACK_BOT_TOKEN }}
          slackAtChannelMentionOnFailure: ${{ inputs.slack_at_channel_on_failure == 'true' }}
      # stage/prod の場合は backend 通知チャンネルにも CI 完了を通知する
      # （旧 deploy-all.yml の notify-ci-complete ジョブの機能を移管）
      - uses: ./.github/actions/slack-backend-notification
        if: ${{ needs.execute.result != 'skipped' && (inputs.env == 'stage' || inputs.env == 'prod') }}
        with:
          env: ${{ inputs.env }}
          message_type: ci_complete
          result: ${{ needs.execute.result }}
          slackToken: ${{ secrets.SLACK_BOT_TOKEN }}
