name: deploy-on-push-common

on:
  workflow_call:
    inputs:
      env:
        type: string
        required: true
      app_name:
        type: string
        required: true
      concurrency_key:
        type: string
        required: true
      deploy_workflow_type:
        type: string
        required: true
        description: "Type of deployment workflow to use"

concurrency:
  ${{ inputs.concurrency_key }}-${{ inputs.env }}

permissions:
  contents: read

jobs:
  deploy-web:
    permissions:
      contents: read
      id-token: write
    if: ${{ inputs.deploy_workflow_type == 'web' }}
    uses: ./.github/workflows/deploy-web.yml
    with:
      env: ${{ inputs.env }}
    secrets: inherit

  deploy-manage:
    permissions:
      contents: read
      id-token: write
    if: ${{ inputs.deploy_workflow_type == 'manage' }}
    uses: ./.github/workflows/deploy-manage.yml
    with:
      env: ${{ inputs.env }}
    secrets: inherit

  deploy-firebase:
    permissions:
      contents: read
      id-token: write
    if: ${{ inputs.deploy_workflow_type == 'firebase' }}
    uses: ./.github/workflows/firebase-deploy.yml
    with:
      env: ${{ inputs.env }}
    secrets: inherit


  deploy-common:
    permissions:
      contents: read
      id-token: write
    if: ${{ inputs.deploy_workflow_type == 'deploy' }}
    uses: ./.github/workflows/deploy.yml
    with:
      env: ${{ inputs.env }}
      app: ${{ inputs.app_name }}
    secrets: inherit
